- function:
    name: BlockZero
    args:
    - name: destPtr
      type: void*
    - name: byteCount
      type: Size
    comment: Memory (PowerPC)
    m68k-body: |
      /* volatile, so the loop is not turned into a call to memset */
      volatile char *p = (volatile char *)destPtr;
      while (byteCount-- > 0)
          *p++ = 0;

