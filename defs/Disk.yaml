# ####

- struct:
    name: DrvSts
    members:
      - name: track
        type: INTEGER
      - name: writeProt
        type: SignedByte
      - name: diskInPlace
        type: SignedByte
      - name: installed
        type: SignedByte
      - name: sides
        type: SignedByte
      - name: qLink
        type: QElemPtr
      - name: qType
        type: INTEGER
      - name: dQDrive
        type: INTEGER
      - name: dQRefNum
        type: INTEGER
      - name: dQFSID
        type: INTEGER
      - name: twoSideFmt
        type: SignedByte
      - name: needsFlush
        type: SignedByte
      - name: diskErrs
        type: INTEGER
    size: 22

# ####

- function:
    name: DiskEject
    return: OSErr
    args:
      - name: rn
        type: INTEGER
    m68k-needs: [ParamBlockRec, PBControlSync]
    m68k-body: |
      ParamBlockRec pb;
      pb.cntrlParam.ioCompletion = 0;
      pb.cntrlParam.ioVRefNum = rn;
      pb.cntrlParam.ioCRefNum = -5;    /* .Sony */
      pb.cntrlParam.csCode = 7;
      return PBControlSync(&pb);

# ####

- function:
    name: SetTagBuffer
    return: OSErr
    args:
      - name: bp
        type: Ptr
    m68k-needs: [ParamBlockRec, PBControlSync]
    m68k-body: |
      ParamBlockRec pb;
      pb.cntrlParam.ioCompletion = 0;
      pb.cntrlParam.ioVRefNum = 0;
      pb.cntrlParam.ioCRefNum = -5;    /* .Sony */
      pb.cntrlParam.csCode = 8;
      *(Ptr *)pb.cntrlParam.csParam = bp;
      return PBControlSync(&pb);

# ####

- function:
    name: DriveStatus
    return: OSErr
    args:
      - name: dn
        type: INTEGER
      - name: statp
        type: DrvSts*
    m68k-needs: [ParamBlockRec, PBStatusSync, BlockMoveData]
    m68k-body: |
      ParamBlockRec pb;
      OSErr err;
      pb.cntrlParam.ioCompletion = 0;
      pb.cntrlParam.ioVRefNum = dn;
      pb.cntrlParam.ioCRefNum = -5;    /* .Sony */
      pb.cntrlParam.csCode = 8;
      err = PBStatusSync(&pb);
      BlockMoveData(pb.cntrlParam.csParam, statp, 22);
      return err;
