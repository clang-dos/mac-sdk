- lowmem:
    name: ROM85
    type: INTEGER
    address: 0x28E
    comment: |
      * NOTE: Theoretically ROM85 is mentioned in IMV, but I don't know where.
       * On a Mac+ the value 0x7FFF is stored there.
       * tim: It is at least on page IMV-328.
      MacTypes IMV-328 (true-b);

