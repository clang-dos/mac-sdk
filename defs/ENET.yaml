# ####

- struct:
    name: EParamBlock
    size: 38
    members:
    - name: qLink
      type: QElemPtr
    - name: qType
      type: INTEGER
    - name: ioTrap
      type: INTEGER
    - name: ioCmdAddr
      type: Ptr
    - name: ioCompletion
      type: ENETCompletionUPP
    - name: ioResult
      type: OSErr
    - name: ioNamePtr
      type: StringPtr
    - name: ioVRefNum
      type: INTEGER
    - name: ioRefNum
      type: INTEGER
    - name: csCode
      type: INTEGER
    - name: u
      union:
      - name: EParms1
        struct:
        - name: eProtType
          type: INTEGER
        - name: ePointer
          type: Ptr
        - name: eBuffSize
          type: INTEGER
        - name: eDataSize
          type: INTEGER
      - name: EParms2
        struct:
        - name: eMultiAddr
          type: uint8_t[6]
    comment: Set ioRefNum to the Ethernet driver's reference number.

# ####

- typedef:
    name: EParamBlkPtr
    type: EParamBlock*

# ####

- function:
    name: EWrite
    return: OSErr
    args:
    - type: EParamBlkPtr
      name: thePBptr
    - type: Boolean
      name: async
    m68k-body: |
      thePBptr->csCode = ENetWrite;
      return async ? PBControlAsync((ParmBlkPtr)thePBptr)
                   : PBControlSync((ParmBlkPtr)thePBptr);
    m68k-needs:
    - ParmBlkPtr
    - PBControlSync
    - PBControlAsync

