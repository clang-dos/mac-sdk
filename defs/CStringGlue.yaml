- function:
    name: p2cstr
    return: char*
    args:
    - name: aStr
      type: StringPtr
    callconv: C
    m68k-needs: [BlockMoveData]
    m68k-body: |
      unsigned char n = aStr[0];
      BlockMoveData(aStr + 1, aStr, n);
      aStr[n] = 0;
      return (char *)aStr;

# ####

- function:
    name: c2pstr
    return: StringPtr
    args:
    - name: aStr
      type: char*
    callconv: C
    m68k-needs: [BlockMoveData]
    m68k-body: |
      const volatile char *p = aStr;
      Size n = 0;
      while (n < 255 && p[n])
          n++;
      BlockMoveData(aStr, aStr + 1, n);
      *(unsigned char *)aStr = (unsigned char)n;
      return (StringPtr)aStr;

# ####

- function:
    name: C2PStr
    args:
    - name: cString
      type: Ptr
    callconv: C
    m68k-needs: [BlockMoveData]
    m68k-body: |
      const volatile char *p = (char *)cString;
      Size n = 0;
      while (n < 255 && p[n])
          n++;
      BlockMoveData(cString, cString + 1, n);
      *(unsigned char *)cString = (unsigned char)n;

