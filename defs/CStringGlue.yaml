
# ####

- function:
    name: addpt
    args:
    - name: src
      type: Point*
    - name: dst
      type: Point*
    callconv: C
    comment: 'C-string forms of Toolbox calls (C calling convention; they take C

      strings, and Points by address). On 68k they need MPW-style glue.'
    m68k-needs: [AddPt]
    m68k-body: |
      AddPt(*src, dst);

# ####

- function:
    name: addresource
    args:
    - name: data
      type: Handle
    - name: typ
      type: ResType
    - name: id
      type: INTEGER
    - name: name
      type: const char*
    callconv: C
    m68k-needs: [AddResource, c2pstrcpy]
    m68k-body: |
      Str255 _s3;
      if (name)
          c2pstrcpy(_s3, name);
      AddResource(data, typ, id, name ? _s3 : (unsigned char *)0);

