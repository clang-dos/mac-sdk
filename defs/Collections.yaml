
# ####

- typedef:
    name: Collection
    type: struct OpaqueCollection*
    comment: 'Collection Manager: an ordered list of tagged items, used by the Window and Appearance Managers
      to store settings.'

# ####

- typedef:
    name: CollectionTag
    type: OSType

# ####

- enum:
    values:
    - name: kCollectionDontWantTag
      value: 0
    - name: kCollectionDontWantId
      value: 0
    - name: kCollectionDontWantSize
      value: 0
    - name: kCollectionDontWantAttributes
      value: 0
    - name: kCollectionDontWantIndex
      value: 0
    - name: kCollectionDontWantData
      value: 0
    - name: kCollectionNoAttributes
      value: 0
    - name: kCollectionAllAttributes
      value: 4294967295
    - name: kCollectionUserAttributes
      value: 65535
    - name: kCollectionDefaultAttributes
      value: 1073741824
    - name: kCollectionUser0Bit
      value: 0
    - name: kCollectionPersistenceBit
      value: 30
    - name: kCollectionLockBit
      value: 31
    - name: kCollectionPersistenceMask
      value: 1073741824
    - name: kCollectionLockMask
      value: 2147483648
    - name: collectionItemLockedErr
      value: -5750
    - name: collectionItemNotFoundErr
      value: -5751
    - name: collectionIndexRangeErr
      value: -5752
    - name: collectionVersionErr
      value: -5753
    - name: gestaltCollectionMgrVersion
