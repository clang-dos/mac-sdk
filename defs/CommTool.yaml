# Raw 68K entry points (Executor only).  The wrapper objects and the
# RAW_<name> prototypes are generated; the bodies live in emustubs.cpp
# (or pack.cpp/patches.cpp), and emustubs.h keeps only the structs.
- only-for: Executor
