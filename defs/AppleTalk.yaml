    - type: ConstStr32Param
      name: nbpType
    - type: ConstStr32Param
      name: nbpZone
    - type: INTEGER
      name: socket
    m68k-body: |
      NamesTableEntry *nte = (NamesTableEntry *)ntePtr;
      nte->qNext = 0;
      nte->nt.nteAddress.aSocket = (unsigned char)socket;
      NBPSetEntity(nte->nt.entityData, nbpObject, nbpType, nbpZone);

# ####

- function:
    name: NBPExtract
    m68k-needs: [BlockMoveData]
    return: OSErr
    args:
    - type: Ptr
      name: theBuffer
    - type: INTEGER
      name: numInBuf
    - type: INTEGER
      name: whichOne
    - type: EntityName*
      name: abEntity
    - type: AddrBlock*
      name: address
    m68k-body: |
      const unsigned char *p = (const unsigned char *)theBuffer;
      unsigned char *dst[3];
      int i;
      if (whichOne < 1 || whichOne > numInBuf)
          return extractErr;
      while (--whichOne > 0) {   /* skip a tuple: address, enumerator, three names */
          p += 5;
          for (i = 0; i < 3; i++)
              p += p[0] + 1;
      }
      address->aNet = (unsigned short)(p[0] << 8 | p[1]);   /* may be odd */
      address->aNode = p[2];
      address->aSocket = p[3];
      p += 5;
      dst[0] = abEntity->objStr; dst[1] = abEntity->typeStr; dst[2] = abEntity->zoneStr;
      for (i = 0; i < 3; i++) {
          BlockMoveData(p, dst[i], p[0] + 1);
          p += p[0] + 1;
      }
      return noErr;
    comment: Gets one name and address from the buffer PLookupName filled.

