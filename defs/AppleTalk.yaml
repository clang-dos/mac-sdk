      register Ptr _a1 __asm__("a1") = LMGetATalkHk2();
      __asm__ __volatile__("jsr 2(%2)"
          : "+r"(_d0), "+r"(_a0), "+a"(_a1)
          :
          : "d1", "d2", "cc", "memory");
      return (OSErr)_d0;
