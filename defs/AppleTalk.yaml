- function:
    name: GetNodeAddress
    return: OSErr
    args:
    - type: INTEGER*
      name: myNode
    - type: INTEGER*
      name: myNet
    m68k-body: |
      Ptr vars = LMGetABusVars();
      if (!IsMPPOpen())
          return noMPPErr;
      *myNode = (signed char)vars[0];
      *myNet = *(short *)(vars + 26);
      return noErr;

