- verbatim: // Opening the drivers

# ####

- function:
    name: MPPOpen
    return: OSErr
    m68k-body: |
      ParamBlockRec pb;
      pb.ioParam.ioCompletion = 0;
      pb.ioParam.ioNamePtr = (StringPtr)"\004.MPP";
      pb.ioParam.ioPermssn = 0;
      return PBOpenSync(&pb);
    m68k-needs:
    - ParamBlockRec
    - StringPtr
    - PBOpenSync

# ####

- function:
    name: ATPLoad
    return: OSErr
    m68k-body: |
      return MPPOpen();
    comment: ATP is part of the .MPP driver.

# ####

- function:
    name: ATPUnload
    return: OSErr
    m68k-body: |
      return noErr;

# ####

- function:
    name: OpenXPP
    return: OSErr
    args:
    - type: INTEGER*
      name: xppRefnum
    m68k-body: |
      ParamBlockRec pb;
      pb.ioParam.ioCompletion = 0;
      pb.ioParam.ioNamePtr = (StringPtr)"\004.XPP";
      pb.ioParam.ioPermssn = 0;
      OSErr err = PBOpenSync(&pb);
      *xppRefnum = pb.ioParam.ioRefNum;
      return err;
    m68k-needs:
    - ParamBlockRec
    - StringPtr
    - PBOpenSync

# ####

- function:
    name: IsMPPOpen
    return: Boolean
    m68k-body: |
      signed char use = (signed char)LMGetPortBUse();
      return use >= 0 && (use & 0x0F) == 1;
    comment: True when port B is configured for AppleTalk and .MPP is open.

# ####

- function:
    name: IsATPOpen
    return: Boolean
    m68k-body: |
      return IsMPPOpen() && (LMGetPortBUse() & 0x10) != 0;

# ####

- function:
    name: PWriteLAP
    return: OSErr
    args:
    - type: MPPPBPtr
      name: thePBptr
    - type: Boolean
      name: async
    m68k-body: |
      thePBptr->MPP.ioRefNum = mppRefNum;
      thePBptr->MPP.csCode = writeLAP;
      return async ? PBControlAsync((ParmBlkPtr)thePBptr)
                   : PBControlSync((ParmBlkPtr)thePBptr);
    m68k-needs:
    - ParmBlkPtr
    - PBControlSync
    - PBControlAsync

