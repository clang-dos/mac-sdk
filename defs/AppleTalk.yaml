- verbatim: // Building records

# ####

- function:
    name: BuildLAPwds
    args:
    - type: Ptr
      name: wdsPtr
    - type: Ptr
      name: dataPtr
    - type: INTEGER
      name: destHost
    - type: INTEGER
      name: protoType
    - type: INTEGER
      name: frameLen
    m68k-body: |
      WDSElement *wds = (WDSElement *)wdsPtr;
      dataPtr[0] = (char)destHost;
      dataPtr[1] = 0;
      dataPtr[2] = (char)protoType;
      dataPtr[3] = (char)((frameLen + 2) >> 8);   /* may be odd: store bytes */
      dataPtr[4] = (char)(frameLen + 2);
      wds[0].entryLength = frameLen + 3;
      wds[0].entryPtr = dataPtr;
      wds[1].entryLength = 0;

# ####

- function:
    name: BuildDDPwds
    args:
    - type: Ptr
      name: wdsPtr
    - type: Ptr
      name: headerPtr
    - type: Ptr
      name: dataPtr
    - type: AddrBlock
      name: netAddr
    - type: INTEGER
      name: ddpType
    - type: INTEGER
      name: dataLen
    m68k-body: |
      WDSElement *wds = (WDSElement *)wdsPtr;
      wds[0].entryPtr = headerPtr + 1;
      wds[1].entryLength = dataLen;
      wds[1].entryPtr = dataPtr;
      wds[2].entryLength = 0;
      *(unsigned short *)(headerPtr + 8) = netAddr.aNet;
      headerPtr[12] = (char)netAddr.aNode;
      headerPtr[14] = (char)netAddr.aSocket;
      headerPtr[16] = (char)ddpType;
    comment: Like the ROM's version, this leaves the first entry's length alone.

# ####

- function:
    name: BuildBDS
    return: INTEGER
    args:
    - type: Ptr
      name: buffPtr
    - type: Ptr
      name: bdsPtr
    - type: INTEGER
      name: buffSize
    m68k-body: |
      BDSElement *bds = (BDSElement *)bdsPtr;
      short n = 0;
      while (buffSize > 0 && n < 8) {
          short len = buffSize < 578 ? buffSize : 578;
          bds[n].buffSize = len;
          bds[n].buffPtr = buffPtr;
          bds[n].dataSize = 0;
          buffPtr += len;
          buffSize -= len;
          n++;
      }
      return n;
    comment: Splits a buffer into ATP response buffers of up to 578 bytes.

# ####

- function:
    name: NBPSetEntity
    m68k-needs: [BlockMoveData]
    args:
    - type: Ptr
      name: buffer
    - type: ConstStr32Param
      name: nbpObject
    - type: ConstStr32Param
      name: nbpType
    - type: ConstStr32Param
      name: nbpZone
    m68k-body: |
      /* BlockMoveData, not a loop: the compiler would turn a loop into memcpy */
      BlockMoveData(nbpObject, buffer, nbpObject[0] + 1);
      buffer += nbpObject[0] + 1;
      BlockMoveData(nbpType, buffer, nbpType[0] + 1);
      buffer += nbpType[0] + 1;
      BlockMoveData(nbpZone, buffer, nbpZone[0] + 1);

