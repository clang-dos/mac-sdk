- verbatim: // The AppleTalk transition queue

# ####

- function:
    name: LAPAddATQ
    return: OSErr
    args:
    - type: ATQEntryPtr
      name: theATQEntry
    m68k-body: |
      register long _d0 __asm__("d0") = 23;
      register ATQEntryPtr _a0 __asm__("a0") = theATQEntry;
      register Ptr _a1 __asm__("a1") = LMGetATalkHk2();
      __asm__ __volatile__("jsr 2(%2)"
          : "+r"(_d0), "+r"(_a0), "+a"(_a1)
          :
          : "d1", "d2", "cc", "memory");
      return (OSErr)_d0;
    m68k-needs:
    - ATalkHk2

